<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MotoSpotter CameraFi Overlay</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:white;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#strip{display:none;position:absolute;bottom:4%;left:2%;max-width:94%;min-width:53%;box-sizing:border-box;border-left:7px solid #ffcc33;background:linear-gradient(90deg,rgba(9,38,82,.97),rgba(15,70,123,.95));box-shadow:0 8px 24px #0008;padding:15px 23px 15px 20px;text-shadow:0 1px 2px #0008}
#eyebrow{font-weight:950;color:#ffcf42;font-size:16px;letter-spacing:.11em;white-space:nowrap}#main{font-size:30px;font-weight:950;line-height:1.25;margin:2px 0;overflow-wrap:anywhere}#sub{font-size:17px;color:#d7e7fb;line-height:1.3;overflow-wrap:anywhere}
@media(max-width:850px){#strip{padding:9px 12px;min-width:66%;border-left-width:5px}#eyebrow{font-size:11px}#main{font-size:20px}#sub{font-size:12px}}
</style></head><body><div id="strip" role="presentation"><div id="eyebrow">MOTOSPOTTER • NOW SHOWING — DEMO</div><div id="main"></div><div id="sub"></div></div>
<script type="module">
import {firebaseConfig,firebaseReady} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js';
const strip=document.getElementById('strip');
function show(data){
 if(!data?.callsign||data.visible===false){strip.style.display='none';return}
 document.getElementById('main').textContent=String(data.callsign)+'  ·  '+String(data.aircraft||'');
 document.getElementById('sub').textContent=String(data.route||'')+'  ·  '+String(data.phase||'')+'  ·  TEMSİLİ VERİ';
 strip.style.display='block';
}
// Test: CameraFi'ye .../overlay.html?test=1 ver; sabit örnek grafik görünür.
if(new URLSearchParams(location.search).has('test')){
 show({callsign:'DEMO 001',aircraft:'Airbus A350-900',route:'Örnek yaklaşma',phase:'Simülasyon',visible:true});
}else if(firebaseReady){
 try{
  const db=getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db,'broadcast/active'),snap=>show(snap.val()),()=>show(null));
 }catch(e){show(null)}
}else{show(null)}
</script></body></html>
